<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Skiptrace Portal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">ST</span>
      <span>Skiptrace Portal</span>
    </div>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('api_export') }}">Export CSV</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <small>Results are for skip-tracing workflows only. Comply with FCRA, GLBA, DPPA, and TCPA where applicable.</small>
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
